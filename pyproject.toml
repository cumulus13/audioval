[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "audioval"
version = "1.0.4"
description = "Advanced Audio Validator: Detect corrupted files and empty tags."
readme = "README.md"
requires-python = ">=3.7"
authors = [
    { name = "Hadi Cahyadi", email = "cumulus13@gmail.com" },
]
dependencies = [
    "mutagen>=1.46.0",
    "rich>=13.0.0",
]
keywords = [
    "audio",
    "validator",
    "mutagen",
    "flac",
    "mp3",
    "cli",
]

[project.license]
text = "MIT"

[project.scripts]
audioval = "audioval.cli:main"

[tool.coverage.run]
omit = [
    "audioval/__main__.py",
    "audioval/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "except KeyboardInterrupt:",
    "sys.exit\\(130\\)",
]
